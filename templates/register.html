{% extends "base.html" %}{% block title %}Register — ProjectVault{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-card wide"><span class="eyebrow">Join the community</span><h1>Create your student profile</h1><p>Start documenting and showcasing your work.</p><form method="post" class="stack-form two"><label>Full name<input name="name" required /></label><label>Email<input name="email" type="email" required /></label><label>Password<input name="password" type="password" minlength="6" required /></label><label>Graduation year<input name="graduation_year" type="number" min="2000" max="2100" required /></label><label>College<input name="college" required /></label><label>Department<input name="department" required /></label><button class="btn full span2">Create Account</button></form><p class="center">Already registered? <a href="/login">Sign in</a></p></div></section>{% endblock %}
